[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscore"
version = "0.2.0"
description = "A modular command-line toolkit for defensive auditing and authorized testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AegisCore contributors" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
pcap = ["scapy>=2.5.0"]
cloud = ["boto3>=1.34.0"]
stego = ["stegano>=0.11.2"]
dev = ["pytest>=8.0"]
all = [
    "scapy>=2.5.0",
    "boto3>=1.34.0",
    "stegano>=0.11.2",
]

[project.scripts]
aegis = "aegiscore.main:app"

[project.urls]
Repository = "https://github.com/icaspian/aegiscore"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
